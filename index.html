<style>
:root{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;

.card{width:min(360px,92vw);padding:34px 30px;border-radius:16px;

  background:#0f1720;color:inherit;font-size:15px;outline:none}
@media (prefers-color-scheme:light){input{background:#f4f6f9;border-color:#d3dae3}}
input:focus{border-color:#3b82f6}
button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;cursor:pointer;
  background:#3b82f6;color:#fff;font-size:15px;font-weight:600}
button:hover{background:#2f6fe0}
button:disabled{opacity:.6;cursor:default}
.err{color:#f87171;font-size:13px;margin-top:12px;min-height:18px;text-align:center}
.brand{text-align:center;margin-bottom:18px;font-size:22px}
</style></head>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},
    km,{name:"AES-GCM",length:256},false,["decrypt"]);
}
async function decrypt(pw){
  const key=await deriveKey(pw);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(CT));
  return new TextDecoder().decode(pt);
}
async function open(pw,silent){
  try{
    const html=await decrypt(pw);
    sessionStorage.setItem("afea_dpw",pw);
    document.open();document.write(html);document.close();
  }catch(err){
    sessionStorage.removeItem("afea_dpw");
    if(!silent){document.getElementById("e").textContent="Parol yanlışdır.";
      document.getElementById("b").disabled=false;document.getElementById("pw").focus();}
  }
}
document.getElementById("f").addEventListener("submit",e=>{
  e.preventDefault();document.getElementById("e").textContent="";
  document.getElementById("b").disabled=true;
  open(document.getElementById("pw").value,false);
});

const saved=sessionStorage.getItem("afea_dpw");
if(saved){open(saved,true);}
